<title>JEANNIE HAN</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:"Input Mono", monospace;
    overflow-x:hidden;
  }

  a { color:inherit; text-decoration:none; }

  /*
    Match Information’s first hairline:
      wrap clears topbar + 12px; rule tucks 4px above content start
      → rule sits at topbar-h + 8px on both pages.
  */
  .wrap {
    padding:calc(var(--topbar-h) + 12px) var(--pad-x) calc(12px + 0.5px + 40px);
  }

  .index-top-rule {
    height:0.5px;
    background:var(--text);
    margin:-4px 0 8px;
    pointer-events:none;
  }

  /*
    Equal image-to-image spacing. Titles sit under each crop and hang into
    the row gap so they don't stretch the vertical distance between media.
  */
  .index-grid {
    --index-gap:clamp(10px, 1vw, 10px);
    --title-space:calc(9px * 0.9 * 2 + 10px);
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    column-gap:var(--index-gap);
    row-gap:calc(var(--index-gap) + var(--title-space));
    width:100%;
    padding-bottom:var(--title-space);
  }

  .index-card {
    position:relative;
    min-width:0;
  }

  .index-card__media {
    display:block;
    width:100%;
    aspect-ratio:3 / 2;
    overflow:hidden;
    background:var(--bg);
  }
  .index-card__media img {
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
  }

  .index-card__title {
    position:absolute;
    left:0;
    right:0;
    top:100%;
    margin:8px 0 0;
    font-family:"Input Mono", monospace;
    font-size:9px;
    font-weight:400;
    line-height:1.35;
    letter-spacing:0;
    max-width:100%;
  }

  @media (max-width:768px) {
    .index-grid {
      grid-template-columns:1fr;
    }
  }
</style>
</head>

<script>
  (function () {
    const mq = window.matchMedia('(max-width: 768px)');
    function apply() {
      document.querySelectorAll('img[data-mobile-src]').forEach((img) => {
        if (!img.dataset.desktopSrc) img.dataset.desktopSrc = img.getAttribute('src') || '';
        const next = mq.matches && img.dataset.mobileSrc ? img.dataset.mobileSrc : img.dataset.desktopSrc;
        if (img.getAttribute('src') !== next) img.setAttribute('src', next);
      });
    }
    apply();
    mq.addEventListener('change', apply);
  })();
</script>
