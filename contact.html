<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="fonts.css">
<meta charset="UTF-8">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeannie Han</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    min-height:100%;
    background:#fff;
    color:#000;
    font-family:"Input Mono", monospace;
  }

  a { color:inherit; text-decoration:none; }

  /*
    Top structure (matches index chrome):
      12px → line → 9px → nav text → 9px → 9px → title
  */
  .topbar {
    padding-bottom:9px;
  }

  /* Matches landing compose-btn bottom hairline */
  .chrome-rule--bottom {
    position:fixed;
    bottom:12px;
    left:var(--pad-x);
    right:var(--pad-x);
    height:0.5px;
    background:#000;
    z-index:101;
    pointer-events:none;
  }

  /* Grows past the viewport rather than clipping when the form is taller */
  .wrap {
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:calc(12px + 0.5px + 9px + 9px + 9px + 9px) var(--pad-x) calc(12px + 0.5px + 9px + 40px);
  }

  .connect-col {
    width:100%;
    max-width:64ch;
  }

  .connect-title {
    font-size:12px;
    font-weight:700;
    line-height:1;
    text-transform:uppercase;
    text-align:center;
    color:#000;
  }

  .connect-form {
    margin-top:1.45em;
    font-size:10px;
    line-height:1.45;
  }

  .field + .field {
    margin-top:1.45em;
  }
  .field label {
    display:block;
    font-weight:400;
  }
  .field input,
  .field textarea {
    display:block;
    width:100%;
    margin-top:0.35em;
    padding:6px 8px;
    font-family:"Input Mono", monospace;
    font-size:10px;
    line-height:1.45;
    color:#000;
    background:#ececec;
    border:0;
    border-bottom:0.5px solid #000;
    border-radius:0;
    -webkit-appearance:none;
    appearance:none;
  }
  .field textarea {
    min-height:calc(10px * 1.45 * 6 + 12px);
    resize:vertical;
  }
  .field input::placeholder,
  .field textarea::placeholder {
    color:#000;
    opacity:0.32;
  }
  .field input:focus,
  .field textarea:focus {
    outline:none;
    border-bottom-color:var(--hover-pink);
  }

  /* Spam trap — real people never see or tab into this */
  .botcheck {
    position:absolute;
    left:-9999px;
    width:1px;
    height:1px;
    overflow:hidden;
  }

  .form-actions {
    margin-top:1.45em;
    display:flex;
    align-items:baseline;
    gap:2ch;
    flex-wrap:wrap;
  }
  .send-btn {
    font-family:"Input Mono Medium", "Input Mono", monospace;
    font-size:10px;
    line-height:1.45;
    font-weight:700;
    color:#000;
    background:transparent;
    border:0;
    padding:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .send-btn[disabled] {
    opacity:0.4;
    cursor:default;
  }
  .form-status {
    font-size:10px;
    line-height:1.45;
  }
  .form-status:empty {
    display:none;
  }
  .form-status.is-error {
    color:var(--hover-pink);
  }

  .connect-alt {
    margin-top:1.45em;
    font-size:10px;
    line-height:1.45;
  }

  @media (max-width:768px) {
    /* name | stacked nav side-by-side, then 9px to title */
    .wrap {
      padding-top:calc(12px + 0.5px + 9px + 9px + (12px + 9px) * 2 + 9px + 9px);
    }
    /* iOS zooms the viewport on focus for anything under 16px */
    .field input,
    .field textarea {
      font-size:16px;
    }
    .field textarea {
      min-height:calc(16px * 1.45 * 6 + 12px);
    }
  }
</style>
</head>
<body>
  <header class="topbar">
    <a class="name" href="index.html">Jeannie Han</a>
    <nav class="topbar-nav">
      <a href="archive.html">Work</a>
      <a href="projects/about.html">Information</a>
      <a href="mailto:jeanniehan10@gmail.com">Let's Connect!</a>
    </nav>
  </header>
  <div class="chrome-rule chrome-rule--bottom" aria-hidden="true"></div>

  <main class="wrap">
    <div class="connect-col">
      <h1 class="connect-title">Contact</h1>

      <form class="connect-form" id="contactForm" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="ad21a218-67a0-4b3b-becb-2aeb973154e1">
        <input type="hidden" name="subject" value="New message from jeanniegracehan.com">
        <input type="hidden" name="from_name" value="jeanniegracehan.com">
        <label class="botcheck"><input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off">Leave this field empty</label>

        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required placeholder="Your name">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required placeholder="Say hello"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="send-btn">Send&gt;&gt;</button>
          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </div>
      </form>

      <p class="connect-alt text-trail">
        Or reach me directly at <a class="link-instant" href="mailto:jeanniehan10@gmail.com">jeanniehan10@gmail.com</a>
      </p>
    </div>
  </main>

<script src="text-trail.js"></script>
<script>
  (function () {
    const form = document.getElementById('contactForm');
    const statusEl = document.getElementById('formStatus');
    if (!form || !statusEl) return;

    const button = form.querySelector('.send-btn');
    const buttonLabel = button.textContent;

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.classList.toggle('is-error', !!isError);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const data = new FormData(form);
      button.disabled = true;
      button.textContent = 'Sending';
      setStatus('');

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          headers: { Accept: 'application/json' },
          body: data,
        });
        const result = await response.json().catch(() => ({}));

        if (response.ok && result.success) {
          form.reset();
          setStatus('Thank you! Your message is on its way.');
        } else {
          setStatus(result.message || 'Something went wrong. Please email me directly.', true);
        }
      } catch (err) {
        setStatus('Network error. Please email me directly.', true);
      } finally {
        button.disabled = false;
        button.textContent = buttonLabel;
      }
    });
  })();
</script>
</body>
</html>
